[project]
name = "hermes-intake"
version = "0.1.0"
description = "Turns a Client's first-call Transcript into an Intake Output a person approves in Slack."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.14.5",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "slack-sdk>=3.45.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not e2e'"
markers = [
    "e2e: runs against the real compose stack, Hermes and real model providers (opt in with -m e2e)",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests are named after the behavior they check; fixtures and tests need no docstrings.
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "ANN"]
# Generated migration scripts.
"alembic/versions/*" = ["D"]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff.lint.isort]
# The local alembic/ migrations folder must not make the alembic library look
# first-party.
known-third-party = ["alembic"]
known-first-party = ["app", "tests"]
