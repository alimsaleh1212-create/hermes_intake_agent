name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync
      # The API and migration tests start Postgres with testcontainers (Docker).
      - run: uv run pytest
      - run: uv run black --check .
      - run: uv run ruff check .

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # `bash -n a b` only parses a; check each script on its own.
      - run: for f in scripts/*.sh; do bash -n "$f"; done
      # compose.yaml reads .env; the example file has every key.
      - run: cp .env.example .env
      - run: docker compose config -q
